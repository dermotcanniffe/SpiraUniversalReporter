<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Spira Universal Reporter</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/reveal.js/5.0.4/reset.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/reveal.js/5.0.4/reveal.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/reveal.js/5.0.4/theme/night.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --r-main-font: 'Urbanist', sans-serif;
            --r-heading-font: 'Urbanist', sans-serif;
            --r-main-color: #94a3b8;
            --r-heading-color: #f8fafc;
            --r-link-color: #f58220;
            --r-selection-background-color: #f58220;
            --r-background-color: #0f172a;
        }
        .reveal h1, .reveal h2, .reveal h3 { text-transform: none; letter-spacing: -0.5px; }
        .reveal h1 { font-size: 2.8em; font-weight: 700; line-height: 1.1; margin-bottom: 20px; }
        .reveal h2 { font-size: 1.8em; border-left: 6px solid var(--r-link-color); padding-left: 15px; text-align: left; margin-bottom: 30px; }
        .text-orange { color: var(--r-link-color) !important; }
        .grid-2 { display: grid; grid-template-columns: 1.2fr 0.8fr; gap: 30px; text-align: left; align-items: center; }
        .tile { background: rgba(30,41,59,0.5); border: 1px solid #334155; border-top: 4px solid var(--r-link-color); border-radius: 8px; padding: 20px; }
        .tile h3 { font-size: 1.1em; margin-bottom: 10px; }
        .tile p { font-size: 0.75em; line-height: 1.4; margin: 0; }
        .reveal ul { display: block; margin-left: 1em; }
        .reveal li { margin-bottom: 15px; font-size: 0.75em; line-height: 1.3; }
        .persistent-header { position: absolute; top: 15px; left: 30px; z-index: 20; }
        .persistent-header img { height: 35px; width: auto; }
        .persistent-footer { position: absolute; bottom: 10px; left: 30px; right: 30px; display: flex; justify-content: space-between; font-size: 12px; color: #475569; font-family: monospace; z-index: 20; }
        .slide-logo { height: 50px; width: auto; margin: 0 0 10px 0 !important; background: none !important; border: none !important; box-shadow: none !important; }
        .center-logo { height: 80px; width: auto; margin: 0 !important; background: none !important; border: none !important; box-shadow: none !important; }
        .hero-logo { height: 120px; width: auto; margin: 0 !important; background: none !important; border: none !important; box-shadow: none !important; }
        .mermaid svg { max-width: 85%; margin: 0 auto; }
    </style>
</head>
<body>
    <div class="persistent-header">
        <img src="https://www.inflectra.com/Images/Media-Kit/spiraPlan-logo-light-no-bg.png" alt="SpiraPlan">
    </div>
    <div class="persistent-footer">
        <span>&copy; 2026 Inflectra Corporation</span>
        <span>Spira Universal Reporter</span>
    </div>
    <div class="reveal">
        <div class="slides">
