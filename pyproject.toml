[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "spira-universal-reporter"
version = "1.0.0"
description = "Universal test result reporter for Inflectra SpiraPlan"
requires-python = ">=3.9"
dependencies = [
    "requests>=2.28",
    "beautifulsoup4>=4.11",
    "python-dotenv>=1.0",
    "truststore>=0.8",
]

[project.scripts]
spira-report = "spira_integration.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
